<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>每日健身 · 训练打卡记录</title>
<meta name="description" content="按天记录训练动作、组数重量、时长与体重，自动带入上次成绩、识别 PR、统计连续打卡与周月容量。">
<meta name="theme-color" content="#0F1115">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每日健身">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root{
    --bg:#0F1115; --surface:#171A21; --surface-2:#1E222B; --surface-3:#252A34; --line:#262B35;
    --text:#EDEFF5; --text-2:#9AA1AF; --text-3:#6B7280;
    --brand:#FF6B35; --brand-2:#FF9A3C; --ok:#2DD4A7; --danger:#FF6B6B;
    --gold:#FFC94D; --blue:#5B9CFF; --purple:#A78BFA;
  }
  html,body{ height:100%; }
  body{
    background:#08090C; color:var(--text);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  input,select,textarea,button{ font-family:inherit; font-size:inherit; color:inherit; }
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }

  /* ---------- 手机外框（桌面演示用） ---------- */
  .phone{
    width:390px; height:844px; background:var(--bg); border-radius:44px; overflow:hidden;
    position:relative; display:flex; flex-direction:column;
    box-shadow:0 0 0 10px #1A1D24, 0 0 0 11px #2C313C, 0 30px 70px rgba(0,0,0,.6);
  }
  .statusbar{
    height:44px; flex:0 0 auto; display:flex; align-items:flex-end; justify-content:space-between;
    padding:0 22px 6px; font-size:13px; font-weight:600; color:var(--text-2); background:var(--bg);
  }
  .statusbar .dots{ display:flex; gap:4px; align-items:center; }
  .statusbar .dots i{ width:4px; height:9px; background:var(--text-2); border-radius:1px; display:block; }
  .statusbar .dots i:nth-child(4){ width:16px; height:9px; border-radius:2px; background:var(--text-3); }

  .navbar{
    flex:0 0 auto; height:48px; display:flex; align-items:center; padding:0 8px; background:var(--bg);
    border-bottom:1px solid var(--line); position:relative;
  }
  .navbar .title{ position:absolute; left:0; right:0; text-align:center; font-size:16px; font-weight:600; pointer-events:none; }
  .navbar .side{ position:relative; z-index:1; min-width:56px; display:flex; align-items:center; gap:2px; }
  .navbar .side.right{ justify-content:flex-end; }
  .navbtn{
    background:none; border:none; color:var(--text-2); padding:6px 8px; font-size:13px; cursor:pointer; border-radius:8px;
  }
  .navbtn.brand{ color:var(--brand); font-weight:600; }
  .navbtn:active{ background:var(--surface-2); }

  .screen{
    flex:1 1 auto; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch;
    padding:12px 14px calc(20px + env(safe-area-inset-bottom,0px)); background:var(--bg);
  }
  .screen::-webkit-scrollbar{ width:0; }

  .tabbar{
    flex:0 0 auto; display:flex; background:rgba(23,26,33,.96); border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px); backdrop-filter:blur(12px);
  }
  .tabbar .tab{
    flex:1; padding:7px 0 6px; text-align:center; color:var(--text-3); cursor:pointer; background:none; border:none;
  }
  .tabbar .tab.on{ color:var(--brand); }
  .tabbar .tab .ic{ font-size:19px; line-height:1; display:block; margin-bottom:3px; }
  .tabbar .tab .lb{ font-size:10px; letter-spacing:.3px; }

  /* ---------- 通用组件 ---------- */
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px; }
  .card.tight{ padding:12px; }
  .sec-title{ font-size:13px; font-weight:600; color:var(--text-2); margin:0 2px 8px; display:flex; align-items:center; justify-content:space-between; }
  .sec-title .more{ font-size:12px; color:var(--text-3); font-weight:400; }
  .row{ display:flex; align-items:center; gap:10px; }
  .row.between{ justify-content:space-between; }
  .muted{ color:var(--text-2); } .dim{ color:var(--text-3); }
  .tiny{ font-size:11px; } .sm{ font-size:12px; }
  .b{ font-weight:600; } .num{ font-variant-numeric:tabular-nums; }

  .btn{
    border:none; background:var(--surface-2); color:var(--text); padding:9px 14px; border-radius:10px;
    cursor:pointer; font-size:13px; font-weight:500;
  }
  .btn:active{ opacity:.75; }
  .btn.primary{ background:linear-gradient(135deg,var(--brand),var(--brand-2)); color:#1A1005; font-weight:700; }
  .btn.ghost{ background:transparent; border:1px solid var(--line); color:var(--text-2); }
  .btn.sm{ padding:6px 10px; font-size:12px; border-radius:8px; }
  .btn.block{ display:block; width:100%; text-align:center; }
  .btn.danger{ color:var(--danger); }

  .chip{
    display:inline-flex; align-items:center; gap:4px; padding:5px 10px; border-radius:999px;
    background:var(--surface-2); color:var(--text-2); font-size:12px; border:1px solid transparent; cursor:pointer;
  }
  .chip.on{ background:rgba(255,107,53,.14); border-color:rgba(255,107,53,.4); color:var(--brand-2); font-weight:600; }
  .chips{ display:flex; flex-wrap:wrap; gap:7px; }

  .tag{ padding:2px 7px; border-radius:6px; font-size:11px; background:var(--surface-3); color:var(--text-2); }
  .tag.gold{ background:rgba(255,201,77,.16); color:var(--gold); font-weight:600; }

  /* ---------- 训练页 ---------- */
  .hero{
    background:linear-gradient(150deg,#221A16 0%,#171A21 62%); border:1px solid var(--line);
    border-radius:18px; padding:16px; margin-bottom:12px; position:relative; overflow:hidden;
  }
  .hero .date{ font-size:12px; color:var(--text-2); }
  .hero .h1{ font-size:21px; font-weight:700; margin:3px 0 2px; }
  .hero .sub{ font-size:12px; color:var(--text-3); }
  .hero .acts{ margin-top:13px; display:flex; gap:8px; }
  .hero .streak{ position:absolute; right:14px; top:14px; text-align:right; }
  .hero .streak .n{ font-size:24px; font-weight:800; color:var(--brand); line-height:1; }
  .hero .streak .t{ font-size:10px; color:var(--text-3); margin-top:2px; }

  .excard{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:13px; margin-bottom:12px; }
  .excard .hd{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .excard .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .excard .nm{ font-size:15px; font-weight:600; flex:1; }
  .excard .del{ background:none; border:none; color:var(--text-3); font-size:16px; padding:0 2px; cursor:pointer; }
  .lastline{
    font-size:11.5px; color:var(--text-3); background:var(--surface-2); border-radius:8px;
    padding:6px 9px; margin-bottom:9px; display:flex; gap:6px; align-items:baseline;
  }
  .lastline .k{ color:var(--text-2); flex:0 0 auto; }
  .lastline .v{ color:var(--text); font-variant-numeric:tabular-nums; }

  .setrow{ display:flex; align-items:center; gap:7px; margin-bottom:6px; }
  .setrow .idx{
    width:22px; height:22px; border-radius:6px; background:var(--surface-3); color:var(--text-3);
    font-size:11px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .setrow .idx.pr{ background:rgba(255,201,77,.18); color:var(--gold); font-weight:700; }
  .inp{
    flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:9px;
    padding:8px 10px; font-size:14px; text-align:center; min-width:0; color:var(--text);
  }
  .inp:focus{ outline:none; border-color:var(--brand); }
  .inp::placeholder{ color:var(--text-3); }
  .unit{ font-size:11px; color:var(--text-3); flex:0 0 auto; }
  .setrow .ok{
    width:26px; height:26px; border-radius:50%; border:1.5px solid var(--line); background:none;
    color:var(--text-3); font-size:12px; cursor:pointer; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
  }
  .setrow .ok.done{ background:rgba(45,212,167,.16); border-color:rgba(45,212,167,.45); color:var(--ok); }
  .setrow .rm{ background:none; border:none; color:var(--text-3); font-size:15px; padding:0 2px; cursor:pointer; flex:0 0 auto; }

  .addset{
    width:100%; background:none; border:1px dashed var(--line); color:var(--text-3);
    padding:7px; border-radius:9px; font-size:12px; cursor:pointer; margin-top:3px;
  }

  .emptybox{ text-align:center; padding:34px 16px; color:var(--text-3); }
  .emptybox .ic{ font-size:38px; margin-bottom:10px; opacity:.5; }
  .emptybox .t{ font-size:14px; margin-bottom:4px; }

  /* 组间休息浮层 */
  .rest{
    position:absolute; left:14px; right:14px; bottom:74px; z-index:40;
    background:linear-gradient(135deg,#2A1A12,#1B2029); border:1px solid rgba(255,107,53,.35);
    border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:12px;
    box-shadow:0 12px 34px rgba(0,0,0,.55);
  }
  .rest .n{ font-size:26px; font-weight:800; color:var(--brand); font-variant-numeric:tabular-nums; line-height:1; }
  .rest .lb{ font-size:11px; color:var(--text-2); }
  .rest .btn{ margin-left:auto; }

  .running{
    display:flex; align-items:center; gap:6px; font-size:11px; color:var(--ok);
    background:rgba(45,212,167,.1); padding:4px 9px; border-radius:999px;
  }
  .running i{ width:6px; height:6px; border-radius:50%; background:var(--ok); display:block; animation:blink 1.4s infinite; }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.25} }

  /* ---------- 计划页 ---------- */
  .wk{ display:flex; gap:5px; }
  .wk .d{
    flex:1; text-align:center; padding:7px 0; border-radius:10px; background:var(--surface-2);
    border:1px solid var(--line); cursor:pointer;
  }
  .wk .d .w{ font-size:11px; color:var(--text-3); }
  .wk .d .n{ font-size:12px; font-weight:600; margin-top:2px; color:var(--text-2); }
  .wk .d.on{ background:rgba(255,107,53,.14); border-color:rgba(255,107,53,.45); }
  .wk .d.on .w,.wk .d.on .n{ color:var(--brand-2); }
  .wk .d.today{ box-shadow:inset 0 0 0 1px var(--text-3); }

  .tmpl{
    display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:12px; padding:11px 12px; margin-bottom:8px; cursor:pointer;
  }
  .tmpl .wkname{ font-size:13px; font-weight:600; width:34px; flex:0 0 auto; }
  .tmpl .info{ flex:1; min-width:0; }
  .tmpl .info .nm{ font-size:13.5px; font-weight:600; }
  .tmpl .info .ex{ font-size:11px; color:var(--text-3); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tmpl .arw{ color:var(--text-3); font-size:15px; }

  .setline{
    display:flex; align-items:center; justify-content:space-between; padding:11px 2px;
    border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .setline:last-child{ border-bottom:none; }
  .setline .v{ color:var(--text-2); font-size:13px; }
  .seg{ display:flex; background:var(--surface-2); border-radius:9px; padding:2px; border:1px solid var(--line); }
  .seg button{
    border:none; background:none; color:var(--text-3); padding:5px 11px; border-radius:7px; font-size:12px; cursor:pointer;
  }
  .seg button.on{ background:var(--surface-3); color:var(--text); font-weight:600; }

  .freqrow{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .freqrow .rk{
    width:19px; height:19px; border-radius:5px; background:var(--surface-3); color:var(--text-3);
    font-size:10px; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .freqrow .rk.top{ background:rgba(255,107,53,.18); color:var(--brand-2); font-weight:700; }
  .freqrow .nm{ flex:1; font-size:13.5px; }
  .freqrow .bar{ height:4px; border-radius:2px; background:var(--brand); opacity:.75; }

  /* ---------- 统计 ---------- */
  .kpis{ display:flex; gap:8px; margin-bottom:12px; }
  .kpi{ flex:1; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 8px; text-align:center; }
  .kpi .n{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.15; }
  .kpi .t{ font-size:10.5px; color:var(--text-3); margin-top:3px; }

  .bars{ display:flex; align-items:flex-end; gap:5px; height:104px; padding-top:6px; }
  .bars .b{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; height:100%; justify-content:flex-end; }
  .bars .b .col{ width:100%; border-radius:5px 5px 2px 2px; background:var(--surface-3); min-height:3px; }
  .bars .b .col.on{ background:linear-gradient(180deg,var(--brand-2),var(--brand)); }
  .bars .b .lb{ font-size:10px; color:var(--text-3); }

  .distrow{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
  .distrow .nm{ width:34px; font-size:12.5px; flex:0 0 auto; }
  .distrow .track{ flex:1; height:8px; background:var(--surface-3); border-radius:4px; overflow:hidden; }
  .distrow .fill{ height:100%; border-radius:4px; }
  .distrow .v{ width:52px; text-align:right; font-size:11.5px; color:var(--text-2); font-variant-numeric:tabular-nums; flex:0 0 auto; }

  .prrow{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .prrow:last-child{ border-bottom:none; }
  .prrow .nm{ flex:1; font-size:13.5px; }
  .prrow .nm .sub{ font-size:11px; color:var(--text-3); margin-top:1px; }
  .prrow .val{ font-size:15px; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; }

  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal .h{ text-align:center; font-size:10px; color:var(--text-3); padding-bottom:3px; }
  .cal .c{
    aspect-ratio:1; border-radius:7px; background:var(--surface-2); display:flex; align-items:center;
    justify-content:center; font-size:11px; color:var(--text-3); font-variant-numeric:tabular-nums;
  }
  .cal .c.lv1{ background:rgba(255,107,53,.22); color:var(--text-2); }
  .cal .c.lv2{ background:rgba(255,107,53,.45); color:#fff; }
  .cal .c.lv3{ background:linear-gradient(145deg,var(--brand-2),var(--brand)); color:#1A1005; font-weight:700; }
  .cal .c.today{ box-shadow:inset 0 0 0 1.5px var(--text); }
  .cal .c.pad{ background:none; }

  .spark{ width:100%; height:88px; display:block; }

  /* ---------- 弹层 ---------- */
  .mask{
    position:absolute; inset:0; background:rgba(0,0,0,.6); z-index:60; display:flex; align-items:flex-end;
  }
  .sheet{
    width:100%; max-height:80%; background:var(--surface); border-radius:18px 18px 0 0;
    display:flex; flex-direction:column; overflow:hidden; padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .sheet .sh{ padding:13px 15px 10px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  .sheet .sh .t{ font-size:15px; font-weight:600; }
  .sheet .sb{ padding:12px 15px; overflow-y:auto; flex:1; }
  .sheet .sf{ padding:11px 15px; border-top:1px solid var(--line); display:flex; gap:8px; }
  .sheet .sf .btn{ flex:1; }

  .exitem{
    padding:11px 2px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:9px; cursor:pointer;
  }
  .exitem:last-child{ border-bottom:none; }
  .exitem .dot{ width:7px; height:7px; border-radius:50%; flex:0 0 auto; }
  .exitem .nm{ flex:1; font-size:14px; }
  .exitem .mt{ font-size:11px; color:var(--text-3); }
  .exitem .fq{ font-size:11px; color:var(--text-3); font-variant-numeric:tabular-nums; }

  .field{ display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line); }
  .field:last-child{ border-bottom:none; }
  .field .k{ font-size:13.5px; }
  .field input,.field select{
    background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:6px 10px;
    text-align:right; max-width:150px; color:var(--text);
  }

  .toast{
    position:absolute; left:50%; bottom:96px; transform:translateX(-50%);
    background:rgba(0,0,0,.86); color:#fff; padding:9px 16px; border-radius:10px; font-size:13px;
    z-index:80; opacity:0; transition:opacity .2s; pointer-events:none; max-width:80%; text-align:center;
  }
  .toast.on{ opacity:1; }

  .syncnote{ font-size:11.5px; color:var(--text-3); line-height:1.65; }
  .syncnote b{ color:var(--text-2); font-weight:600; }

  /* ---------- 移动端：全屏 ---------- */
  @media (max-width:560px){
    body{ padding:0; display:block; }
    .phone{ width:100%; height:100vh; height:100dvh; border:none; border-radius:0; box-shadow:none; }
    .statusbar{ height:calc(16px + env(safe-area-inset-top,0px)); padding-bottom:0; }
    .statusbar .time,.statusbar .dots{ display:none; }
  }
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"><span class="time" id="clock">9:41</span><span class="dots"><i></i><i></i><i></i><i></i></span></div>
  <div class="navbar">
    <div class="side" id="navLeft"></div>
    <div class="title" id="navTitle">训练</div>
    <div class="side right" id="navRight"></div>
  </div>
  <div class="screen" id="screen"></div>
  <div class="tabbar" id="tabbar"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
/* APP_JS */
</script>
</body>
</html>
